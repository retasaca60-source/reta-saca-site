# Netlify compila con Vite y publica solo lo compilado (dist/). Lo demás del
# repositorio —README, referencia/, el código fuente— nunca llega al sitio.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 pide Node 20.19 o más nuevo; se fija para que Netlify no use otro.
  NODE_VERSION = "24"

# Las cabeceras de seguridad viven en public/_headers (se publica con Netlify
# Drop y ahí este archivo no se lee).

# Es una aplicación de una sola página: /r/<token>, /c/<token> y /panel no son
# archivos. Sin esto, abrir un link de cobro directo desde WhatsApp da 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
