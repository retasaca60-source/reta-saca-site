<title>Reta Saca</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#f5f6f8;
    --ink:#1a1a1a;
    --ink-soft:#666b76;
    --ink-faint:#9aa1ac;
    --line:#e2e5ea;
    --accent:#ed1c24;
    --accent-2:#ff8a1e;
    --accent-ink:#ffffff;
    --accent-soft:#ffe9ec;
    --teal:#0fb6a6;
    --teal-soft:#e3faf6;
    --warn:#b4650a;
    --warn-soft:#fdf0dd;
    --busy:#dfe2e7;
    --shadow: 0 1px 2px rgba(20,20,25,.04), 0 10px 24px -12px rgba(20,20,25,.14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0d10;
      --surface:#15171c;
      --surface-2:#1b1e24;
      --ink:#f2f3f5;
      --ink-soft:#9aa0ab;
      --ink-faint:#5c626d;
      --line:#262932;
      --accent:#ed1c24;
      --accent-2:#ff9f1c;
      --accent-ink:#ffffff;
      --accent-soft:#3a1620;
      --teal:#2fd9c5;
      --teal-soft:#0f2b28;
      --warn:#f4b350;
      --warn-soft:#302109;
      --busy:#23262d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0d10;
    --surface:#15171c;
    --surface-2:#1b1e24;
    --ink:#f2f3f5;
    --ink-soft:#9aa0ab;
    --ink-faint:#5c626d;
    --line:#262932;
    --accent:#ed1c24;
    --accent-2:#ff9f1c;
    --accent-ink:#ffffff;
    --accent-soft:#3a1620;
    --teal:#2fd9c5;
    --teal-soft:#0f2b28;
    --warn:#f4b350;
    --warn-soft:#302109;
    --busy:#23262d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Sora', system-ui, sans-serif;
    padding-inline:16px;
    padding-block:16px 40px;
    display:flex;
    justify-content:center;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
  .app{ width:100%; max-width:460px; }

  /* ---------- masthead: logo mark ---------- */
  .masthead{
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    padding-block:4px 6px;
  }
  .logo{
    width:132px; height:132px;
    border-radius:50%;
    box-shadow:var(--shadow);
  }
  .tagline{
    margin-top:12px;
    font-size:.76rem;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--ink-soft);
  }
  .tagline .dot{ color:var(--accent); margin-inline:6px; }

  .demo-banner{
    display:flex; align-items:flex-start; gap:8px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink-soft);
    border-radius:14px;
    font-size:.74rem; line-height:1.45;
    padding:10px 12px;
    margin-top:14px;
    box-shadow:var(--shadow);
  }
  .demo-banner svg{ flex:none; margin-top:1px; color:var(--warn); }

  /* ---------- progress ---------- */
  .progress{ margin-top:18px; margin-bottom:16px; }
  .progress-track{ display:flex; gap:6px; }
  .progress-seg{
    flex:1; height:4px; border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-seg > i{
    display:block; height:100%; width:0%;
    background:linear-gradient(95deg, var(--accent), var(--accent-2));
    transition:width .4s ease;
    border-radius:999px;
  }
  .progress-seg.done > i{ width:100%; }
  .progress-seg.active > i{ width:55%; }
  .progress-labels{
    display:flex; justify-content:space-between;
    margin-top:8px; font-size:.66rem; font-weight:600;
    letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .progress-labels span.current{ color:var(--accent); }

  /* ---------- screen transition ---------- */
  .screen{ animation:screenIn .35s ease both; }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none; } }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .card + .card{ margin-top:12px; }

  h2.section-title{
    font-family:'Unbounded', system-ui, sans-serif;
    font-weight:700;
    font-size:1.08rem;
    letter-spacing:-.01em;
    margin:0 0 4px;
    text-wrap:balance;
  }
  .section-hint{ font-size:.8rem; color:var(--ink-soft); margin:0 0 14px; }

  /* ---------- sport tiles ---------- */
  .sport-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:10px;
  }
  .sport-tile{
    position:relative;
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    border-radius:16px;
    padding:14px;
    cursor:pointer;
    text-align:left;
    font:inherit; color:var(--ink);
    transition:border-color .15s, background .15s, transform .1s;
  }
  .sport-tile:active{ transform:scale(.98); }
  .sport-tile:hover{ border-color:var(--ink-faint); }
  .sport-tile.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:0 0 0 1px var(--accent);
  }
  .sport-tile .check{
    position:absolute; top:10px; right:10px;
    width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
  }
  .sport-icon{
    width:40px; height:40px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    overflow:hidden;
  }
  .sport-icon img{ width:78%; height:78%; object-fit:contain; }
  .sport-tile.selected .sport-icon{ border-color:var(--accent); background:var(--surface); }
  .sport-name{ font-weight:700; font-size:.92rem; }
  .sport-meta{ font-size:.68rem; color:var(--ink-soft); margin-top:-6px; }
  .sport-price{
    font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;
    font-size:.76rem; font-weight:600; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:3px 9px;
  }

  /* ---------- chips / segmented ---------- */
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    position:relative;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    border-radius:999px;
    padding:9px 16px;
    font:inherit; font-size:.82rem; font-weight:600;
    cursor:pointer;
    transition:border-color .15s, background .15s, color .15s, transform .1s;
  }
  .chip:active{ transform:scale(.96); }
  .chip .badge{
    position:absolute; top:-9px; right:-6px;
    background:var(--teal); color:#04231f;
    font-size:.56rem; font-weight:700;
    padding:2px 6px; border-radius:999px;
    letter-spacing:.02em;
  }
  .chip.selected{
    border-color:transparent;
    background:linear-gradient(95deg, var(--accent), var(--accent-2));
    color:var(--accent-ink);
  }

  /* ---------- dates ---------- */
  .date-scroll{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .date-chip{
    flex:none; width:54px; scroll-snap-align:start;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    border-radius:14px;
    padding:9px 4px 8px;
    text-align:center;
    cursor:pointer; font:inherit; color:var(--ink);
    transition:border-color .15s, background .15s, transform .1s;
  }
  .date-chip:active{ transform:scale(.96); }
  .date-chip .dow{ font-size:.6rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .date-chip .num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; font-size:1.05rem; font-weight:600; margin-top:2px; }
  .date-chip .sun-dot{ width:4px; height:4px; border-radius:50%; background:var(--accent-2); margin:4px auto 0; }
  .date-chip.selected{
    border-color:transparent;
    background:linear-gradient(160deg, var(--accent), var(--accent-2));
    color:var(--accent-ink);
  }
  .date-chip.selected .dow{ color:rgba(255,255,255,.85); }
  .date-chip.selected .sun-dot{ background:#fff; }

  .field-label{
    font-size:.7rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); font-weight:700; margin:18px 0 9px;
  }
  .field-label:first-child{ margin-top:0; }

  /* ---------- time slots ---------- */
  .promo-strip{
    display:flex; align-items:center; gap:7px;
    background:var(--teal-soft); color:var(--teal);
    font-size:.72rem; font-weight:700;
    padding:7px 12px; border-radius:12px;
    margin-bottom:12px;
  }
  .promo-strip::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--teal); }

  .slot-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .slot{
    position:relative;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    border-radius:13px;
    padding:10px 4px;
    text-align:center;
    cursor:pointer; font:inherit; color:var(--ink);
    transition:border-color .15s, background .15s, transform .1s;
  }
  .slot:active{ transform:scale(.96); }
  .slot .t{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; font-weight:600; font-size:.8rem; }
  .slot .p{ font-size:.64rem; color:var(--ink-soft); margin-top:3px; font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  .slot .low{ font-size:.58rem; font-weight:700; color:var(--warn); margin-top:3px; line-height:1.25; text-wrap:balance; }
  .slot.promo .p{ color:var(--teal); font-weight:700; }
  .slot.selected{
    border-color:transparent;
    background:linear-gradient(160deg, var(--accent), var(--accent-2));
  }
  .slot.selected .t, .slot.selected .p, .slot.selected .low{ color:var(--accent-ink); }
  .slot.full{ background:var(--busy); color:var(--ink-faint); cursor:not-allowed; border-color:var(--busy); }
  .slot.full .t, .slot.full .p{ color:var(--ink-faint); }

  input[type=text], input[type=tel]{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    border-radius:12px;
    padding:12px 13px;
    font:inherit; font-size:.9rem;
    transition:box-shadow .15s, border-color .15s;
  }
  input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .error-text{ font-size:.72rem; color:var(--accent); margin-top:5px; min-height:1em; }

  .summary-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:.85rem; padding:7px 0; border-bottom:1px dashed var(--line);
  }
  .summary-row:last-of-type{ border-bottom:none; }
  .summary-row .label{ color:var(--ink-soft); }
  .summary-row .value{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; font-weight:600; }
  .summary-total{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:10px; padding-top:14px; border-top:1.5px solid var(--line);
  }
  .summary-total .label{ font-weight:700; font-size:.9rem; }
  .summary-total .value{
    font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; font-weight:800; font-size:1.3rem;
    background:linear-gradient(95deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .split-note{
    display:flex; gap:10px; margin-top:12px;
  }
  .split-box{
    flex:1; border-radius:12px; padding:10px 11px;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .split-box .k{ font-size:.63rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; }
  .split-box .v{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; font-weight:700; font-size:.95rem; margin-top:3px; }
  .split-box.now{ background:var(--accent-soft); border-color:transparent; }
  .split-box.now .v{ color:var(--accent); }

  .btn{
    width:100%;
    border:none; border-radius:14px;
    padding:15px; font:inherit; font-weight:700; font-size:.92rem;
    letter-spacing:.01em;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .1s, opacity .15s, box-shadow .15s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{
    background:linear-gradient(95deg, var(--accent), var(--accent-2));
    color:var(--accent-ink);
    box-shadow:0 10px 22px -10px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .btn-primary:disabled{ background:var(--busy); color:var(--ink-faint); cursor:not-allowed; box-shadow:none; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }

  .nav-row{ display:flex; gap:10px; margin-top:16px; }
  .nav-row .btn-ghost{ flex:0 0 auto; width:auto; padding-inline:18px; }
  .nav-row .btn-primary{ flex:1; }

  .success-wrap{ text-align:center; padding-block:6px; }
  .success-icon{
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(160deg, var(--teal), #0aa093);
    color:#04231f;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px;
    box-shadow:0 12px 26px -12px color-mix(in srgb, var(--teal) 60%, transparent);
  }
  .success-title{ font-family:'Unbounded', sans-serif; font-weight:700; font-size:1.35rem; letter-spacing:-.01em; }
  .code-box{
    position:relative;
    font-family:'IBM Plex Mono', monospace;
    background:var(--surface-2);
    border:1.5px dashed var(--line);
    border-radius:12px; padding:12px; margin:16px 0;
    font-size:1.2rem; font-weight:700; letter-spacing:.08em;
  }

  [hidden]{ display:none !important; }
</style>

<div class="app">
  <div class="masthead">
    <img class="logo" src="logo.png" alt="Reta Saca">
    <div class="tagline">PING PONG<span class="dot">&bull;</span>CORNHOLE<span class="dot">&bull;</span>POPDARTS</div>
  </div>

  <div class="demo-banner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    <span>Modo demostraci&oacute;n &mdash; disponibilidad de ejemplo. Ninguna reserva se guarda de verdad.</span>
  </div>

  <div class="progress" id="progress"></div>

  <div id="screens"></div>
</div>

<script>
(function(){
  "use strict";

  var SPORTS = {
    pingpong: {
      label: "Ping Pong",
      short: "PP",
      capacity: 6,
      icon: '<img src="paddle-icon.png" alt="">',
      prices:  {30:100, 60:150, 90:220, 120:280},
      promo:   {30:80,  60:120, 90:175, 120:225},
      prices2: {30:100, 60:150, 90:220, 120:280},
      promo2:  {30:80,  60:120, 90:175, 120:225},
      prices4: {30:150, 60:200, 90:270, 120:330},
      promo4:  {30:130, 60:170, 90:225, 120:275},
      promoEligible: true
    },
    cornhole: {
      label: "Cornhole",
      short: "CH",
      capacity: 8,
      icon: '<img src="bag-icon.png" alt="">',
      prices4: {30:200, 60:300, 90:440, 120:560},
      promo4:  {30:160, 60:240, 90:350, 120:450},
      prices2: {30:100, 60:150, 90:220, 120:280},
      promo2:  {30:80,  60:120, 90:175, 120:225},
      promoEligible: true
    },
    popdarts: {
      label: "Popdarts",
      short: "PD",
      capacity: 3,
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>',
      prices: {30:60, 60:120, 90:175, 120:230},
      prices2: {30:60, 60:120, 90:175, 120:230},
      prices4: {30:60, 60:120, 90:175, 120:230},
      promoEligible: false
    }
  };
  var DEPOSITS = {30:50, 60:75, 90:110, 120:140};
  var DURATIONS = [30,60,90,120];
  var HOURS = [17,18,19,20,21,22];
  var CLOSE_MIN = 23*60;
  var DOW = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  var STEP_LABELS = ["Deporte", "Horario", "Datos"];

  var state = {
    step: 1,
    sport: null,
    people: null,
    dateOffset: 0,
    duration: 60,
    slotHour: null,
    name: "",
    whatsapp: "",
    bookingCode: null,
    assignedTable: null
  };

  function fmtMoney(n){ return "$" + n.toLocaleString("es-MX"); }
  function fmtHour(h){
    var period = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if(h12===0) h12 = 12;
    return h12 + ":00 " + period;
  }
  function dateAt(offset){
    var d = new Date();
    d.setDate(d.getDate() + offset);
    return d;
  }
  function isSunday(offset){ return dateAt(offset).getDay() === 0; }

  function seedRand(str){
    var h = 0;
    for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return function(){ h = (h*1103515245 + 12345) >>> 0; return (h % 1000) / 1000; };
  }

  function priceFor(sport, people, duration, promo){
    var cfg = SPORTS[sport];
    if(cfg.prices4){
      var table = (people === 4) ? (promo ? cfg.promo4 : cfg.prices4)
                                  : (promo ? cfg.promo2 : cfg.prices2);
      return table[duration];
    }
    var table2 = (promo && cfg.promoEligible) ? cfg.promo : cfg.prices;
    return table2[duration];
  }

  function isPromoSlot(sport, offset, hour, duration){
    if(!SPORTS[sport].promoEligible) return false;
    if((sport === "pingpong" || sport === "cornhole") && duration !== 60) return false;
    if(isSunday(offset)) return true;
    return hour === 17;
  }

  function occupiedCount(sport, offset, hour, capacity){
    var rnd = seedRand(sport + "|" + offset + "|" + hour);
    var v = rnd();
    if(v < 0.12) return capacity;
    if(v < 0.35) return Math.max(0, capacity - 1);
    if(v < 0.55) return Math.ceil(capacity/2);
    return Math.floor(v * capacity * 0.4);
  }

  function depositFor(sport, duration, total){
    if(sport === "popdarts") return total;
    if(sport === "pingpong" && (duration === 30 || duration === 60)) return total;
    return DEPOSITS[duration];
  }

  function lowStockText(sport, remaining){
    if(remaining < 1) return null;
    if((sport === "pingpong" || sport === "cornhole") && remaining <= 3){
      return remaining === 1 ? "Queda 1 disponible" : "Quedan " + remaining + " disponibles";
    }
    if(sport === "popdarts" && remaining === 1){
      return "Queda 1 disponible";
    }
    return null;
  }

  // ---------- rendering ----------

  function renderProgress(){
    var wrap = document.getElementById("progress");
    var macro = state.step <= 1 ? 1 : (state.step === 2 ? 2 : 3);
    var track = '<div class="progress-track">' + [1,2,3].map(function(n){
      var cls = "progress-seg" + (n < macro ? " done" : (n === macro ? " active" : ""));
      return '<div class="' + cls + '"><i></i></div>';
    }).join("") + '</div>';
    var labels = '<div class="progress-labels">' + STEP_LABELS.map(function(l, i){
      var n = i+1;
      return '<span class="' + (n===macro ? 'current' : '') + '">' + (n<10?"0"+n:n) + ' ' + l + '</span>';
    }).join("") + '</div>';
    wrap.innerHTML = track + labels;
  }

  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function render(){
    renderProgress();
    var root = document.getElementById("screens");
    root.innerHTML = "";
    if(state.step === 1) root.appendChild(screenSport());
    else if(state.step === 2) root.appendChild(screenSchedule());
    else if(state.step === 3) root.appendChild(screenContact());
    else if(state.step === 4) root.appendChild(screenSuccess());
  }

  function screenSport(){
    var wrap = el('<div class="screen"></div>');

    var c1 = el('<div class="card"></div>');
    c1.appendChild(el('<h2 class="section-title">Elige tu deporte</h2>'));
    var grid = el('<div class="sport-grid"></div>');

    Object.keys(SPORTS).forEach(function(key){
      var cfg = SPORTS[key];
      var hourPrice = key === "cornhole" ? cfg.prices4[60] : cfg.prices2[60];
      var selected = state.sport === key;
      var card = el(
        '<button type="button" class="sport-tile' + (selected?' selected':'') + '">' +
          (selected ? '<span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>' : '') +
          '<span class="sport-icon">' + cfg.icon + '</span>' +
          '<span>' +
            '<span class="sport-name">' + cfg.label + '</span><br>' +
            '<span class="sport-meta">' + cfg.capacity + ' mesas</span>' +
          '</span>' +
          '<span class="sport-price">' + fmtMoney(hourPrice) + ' x hora</span>' +
        '</button>'
      );
      card.addEventListener("click", function(){
        state.sport = key;
        state.people = null;
        render();
      });
      grid.appendChild(card);
    });
    c1.appendChild(grid);
    wrap.appendChild(c1);

    if(state.sport){
      var c2 = el('<div class="card"></div>');
      c2.appendChild(el('<h2 class="section-title">¿Cuántos jugadores?</h2>'));
      var peopleHint = state.sport === "pingpong" ? "$50 pesos más si son 4 personas."
                      : state.sport === "cornhole" ? "El estándar y los torneos serán de 4 personas."
                      : state.sport === "popdarts" ? "La cantidad de jugadores no afecta el precio."
                      : "Esto ajusta el precio y la mesa asignada.";
      c2.appendChild(el('<p class="section-hint">' + peopleHint + '</p>'));
      var opts = SPORTS[state.sport].prices4 ? [2,4] : [2];
      var recommended = state.sport === "cornhole" ? 4 : 2;
      var row = el('<div class="chip-row"></div>');
      opts.forEach(function(n){
        var isRec = n === recommended;
        var chip = el(
          '<button type="button" class="chip' + (isRec?' recommended':'') + (state.people===n?' selected':'') + '">' +
            n + ' personas' + (isRec ? '<span class="badge">Recomendado</span>' : '') +
          '</button>'
        );
        chip.addEventListener("click", function(){ state.people = n; render(); });
        row.appendChild(chip);
      });
      if(state.sport === "popdarts"){
        state.people = 2;
      }
      c2.appendChild(row);
      wrap.appendChild(c2);
    }

    var canContinue = state.sport && state.people;
    var nav = el('<div class="nav-row"><span style="flex:1"></span><button type="button" class="btn btn-primary" ' + (canContinue?'':'disabled') + '>Continuar</button></div>');
    var nextBtn = nav.querySelector(".btn-primary");
    nextBtn.addEventListener("click", function(){ if(canContinue){ state.step = 2; render(); } });
    wrap.appendChild(nav);

    return wrap;
  }

  function screenSchedule(){
    var wrap = el('<div class="screen"></div>');
    var cfg = SPORTS[state.sport];

    var c1 = el('<div class="card"></div>');
    c1.appendChild(el('<h2 class="section-title">Fecha y duración</h2>'));
    c1.appendChild(el('<p class="section-hint">' + cfg.label + ' &middot; ' + state.people + ' personas</p>'));

    c1.appendChild(el('<div class="field-label">Fecha</div>'));
    var dateScroll = el('<div class="date-scroll"></div>');
    for(var i=0;i<10;i++){
      var d = dateAt(i);
      var sunday = d.getDay() === 0;
      var chip = el(
        '<button type="button" class="date-chip' + (state.dateOffset===i?' selected':'') + '">' +
          '<div class="dow">' + DOW[d.getDay()] + '</div>' +
          '<div class="num">' + d.getDate() + '</div>' +
          (sunday ? '<div class="sun-dot"></div>' : '') +
        '</button>'
      );
      (function(offset){
        chip.addEventListener("click", function(){ state.dateOffset = offset; state.slotHour = null; render(); });
      })(i);
      dateScroll.appendChild(chip);
    }
    c1.appendChild(dateScroll);

    c1.appendChild(el('<div class="field-label">Duración</div>'));
    var durRow = el('<div class="chip-row"></div>');
    var durationOptions = (state.sport === "cornhole" || state.sport === "popdarts") ? DURATIONS.filter(function(d){ return d !== 30; }) : DURATIONS;
    if(durationOptions.indexOf(state.duration) === -1){ state.duration = durationOptions[0]; state.slotHour = null; }
    durationOptions.forEach(function(d){
      var chip = el('<button type="button" class="chip' + (state.duration===d?' selected':'') + '">' + d + ' min</button>');
      chip.addEventListener("click", function(){ state.duration = d; state.slotHour = null; render(); });
      durRow.appendChild(chip);
    });
    c1.appendChild(durRow);
    wrap.appendChild(c1);

    var c2 = el('<div class="card"></div>');
    c2.appendChild(el('<h2 class="section-title">Horario disponible</h2>'));
    var promoActiveForDuration = !((state.sport === "pingpong" || state.sport === "cornhole") && state.duration !== 60);
    if(cfg.promoEligible && promoActiveForDuration && isSunday(state.dateOffset)){
      c2.appendChild(el('<div class="promo-strip">Domingo &mdash; promo todo el día</div>'));
    } else if(cfg.promoEligible && promoActiveForDuration){
      c2.appendChild(el('<div class="promo-strip">Promo 5:00 PM &mdash; 6:00 PM</div>'));
    }

    var grid = el('<div class="slot-grid"></div>');
    var validHours = HOURS.filter(function(h){ return h*60 + state.duration <= CLOSE_MIN; });
    validHours.forEach(function(h){
      var occ = occupiedCount(state.sport, state.dateOffset, h, cfg.capacity);
      var full = occ >= cfg.capacity;
      var remaining = cfg.capacity - occ;
      var promo = isPromoSlot(state.sport, state.dateOffset, h, state.duration);
      var price = priceFor(state.sport, state.people, state.duration, promo);
      var lowText = !full ? lowStockText(state.sport, remaining) : null;
      var cls = "slot" + (full?" full":"") + (promo && !full?" promo":"") + (state.slotHour===h && !full?" selected":"");
      var s = el(
        '<button type="button" class="' + cls + '" ' + (full?'disabled':'') + '>' +
          '<div class="t">' + fmtHour(h) + '</div>' +
          '<div class="p">' + (full ? 'Lleno' : fmtMoney(price)) + '</div>' +
          (lowText ? '<div class="low">' + lowText + '</div>' : '') +
        '</button>'
      );
      if(!full){
        s.addEventListener("click", function(){ state.slotHour = h; render(); });
      }
      grid.appendChild(s);
    });
    c2.appendChild(grid);
    wrap.appendChild(c2);

    var canContinue = state.slotHour !== null;
    var nav = el('<div class="nav-row"></div>');
    var back = el('<button type="button" class="btn btn-ghost">Atrás</button>');
    back.addEventListener("click", function(){ state.step = 1; render(); });
    var next = el('<button type="button" class="btn btn-primary" ' + (canContinue?'':'disabled') + '>Continuar</button>');
    next.addEventListener("click", function(){ if(canContinue){ state.step = 3; render(); } });
    nav.appendChild(back); nav.appendChild(next);
    wrap.appendChild(nav);

    return wrap;
  }

  function screenContact(){
    var wrap = el('<div class="screen"></div>');
    var cfg = SPORTS[state.sport];
    var promo = isPromoSlot(state.sport, state.dateOffset, state.slotHour, state.duration);
    var total = priceFor(state.sport, state.people, state.duration, promo);
    var deposit = depositFor(state.sport, state.duration, total);
    var resto = total - deposit;
    var d = dateAt(state.dateOffset);
    var dateLabel = DOW[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth()+1);

    var c1 = el('<div class="card"></div>');
    c1.appendChild(el('<h2 class="section-title">Tus datos</h2>'));
    c1.appendChild(el('<p class="section-hint">Para confirmar tu reserva.</p>'));

    c1.appendChild(el('<div class="field-label">Nombre</div>'));
    var nameInput = el('<input type="text" placeholder="Tu nombre" id="ff-name">');
    nameInput.value = state.name;
    nameInput.addEventListener("input", function(){ state.name = nameInput.value; updateBtn(); });
    c1.appendChild(nameInput);

    c1.appendChild(el('<div class="field-label">WhatsApp (10 dígitos)</div>'));
    var waInput = el('<input type="tel" placeholder="6621234567" id="ff-wa" maxlength="10">');
    waInput.value = state.whatsapp;
    var waError = el('<div class="error-text"></div>');
    waInput.addEventListener("input", function(){
      state.whatsapp = waInput.value.replace(/\D/g,"").slice(0,10);
      waInput.value = state.whatsapp;
      waError.textContent = (state.whatsapp.length && state.whatsapp.length !== 10) ? "Debe tener 10 dígitos." : "";
      updateBtn();
    });
    c1.appendChild(waInput);
    c1.appendChild(waError);
    wrap.appendChild(c1);

    var c2 = el('<div class="card"></div>');
    c2.appendChild(el('<h2 class="section-title">Resumen</h2>'));
    var rows = [
      ["Deporte", cfg.label + " · " + state.people + " personas"],
      ["Fecha", dateLabel],
      ["Horario", fmtHour(state.slotHour) + " · " + state.duration + " min"]
    ];
    rows.forEach(function(r){
      c2.appendChild(el('<div class="summary-row"><span class="label">' + r[0] + '</span><span class="value">' + r[1] + '</span></div>'));
    });
    if(promo){
      c2.appendChild(el('<div class="summary-row"><span class="label">Promo aplicada</span><span class="value" style="color:var(--teal)">Sí</span></div>'));
    }
    c2.appendChild(el('<div class="summary-total"><span class="label">Total</span><span class="value">' + fmtMoney(total) + '</span></div>'));

    var fullPaymentNow = (state.sport === "popdarts") || (state.sport === "pingpong" && (state.duration === 30 || state.duration === 60));
    var split = el('<div class="split-note"></div>');
    if(fullPaymentNow){
      split.appendChild(el('<div class="split-box now"><div class="k">Se paga ahora</div><div class="v">' + fmtMoney(deposit) + '</div></div>'));
      split.appendChild(el('<div class="split-box"><div class="k">En el lugar</div><div class="v">$0</div></div>'));
    } else {
      split.appendChild(el('<div class="split-box now"><div class="k">Anticipo</div><div class="v">' + fmtMoney(deposit) + '</div></div>'));
      split.appendChild(el('<div class="split-box"><div class="k">En el lugar</div><div class="v">' + fmtMoney(resto) + '</div></div>'));
    }
    c2.appendChild(split);
    wrap.appendChild(c2);

    var nav = el('<div class="nav-row"></div>');
    var back = el('<button type="button" class="btn btn-ghost">Atrás</button>');
    back.addEventListener("click", function(){ state.step = 2; render(); });
    var confirmBtn = el('<button type="button" class="btn btn-primary" disabled>Confirmar reserva</button>');
    confirmBtn.addEventListener("click", function(){
      if(!validForm()) return;
      var pool = [];
      for(var i=1;i<=cfg.capacity;i++) pool.push(cfg.short + " " + i);
      state.assignedTable = pool[Math.floor(Math.random()*pool.length)];
      state.bookingCode = "RS-" + Math.random().toString(36).slice(2,7).toUpperCase();
      state.step = 4;
      render();
    });
    nav.appendChild(back); nav.appendChild(confirmBtn);
    wrap.appendChild(nav);

    function validForm(){
      return state.name.trim().length > 1 && state.whatsapp.length === 10;
    }
    function updateBtn(){
      confirmBtn.disabled = !validForm();
    }
    updateBtn();

    return wrap;
  }

  function screenSuccess(){
    var wrap = el('<div class="card success-wrap screen"></div>');
    var cfg = SPORTS[state.sport];
    var d = dateAt(state.dateOffset);
    var dateLabel = DOW[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth()+1);

    wrap.appendChild(el(
      '<div class="success-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>'
    ));
    wrap.appendChild(el('<div class="success-title">¡Reserva lista!</div>'));
    wrap.appendChild(el('<p class="section-hint">' + cfg.label + " · " + dateLabel + " · " + fmtHour(state.slotHour) + '</p>'));
    wrap.appendChild(el('<div class="code-box">' + state.bookingCode + '</div>'));
    wrap.appendChild(el('<div class="summary-row"><span class="label">Mesa asignada</span><span class="value">' + state.assignedTable + '</span></div>'));
    wrap.appendChild(el('<div class="summary-row"><span class="label">A nombre de</span><span class="value">' + state.name + '</span></div>'));
    wrap.appendChild(el('<div class="section-hint" style="margin-top:14px">Te confirmamos por WhatsApp al ' + state.whatsapp.slice(0,3) + ' ' + state.whatsapp.slice(3,6) + ' ' + state.whatsapp.slice(6) + '. Ejemplo de confirmación &mdash; ningún mensaje real fue enviado.</div>'));

    var again = el('<button type="button" class="btn btn-primary" style="margin-top:18px">Hacer otra reserva</button>');
    again.addEventListener("click", function(){
      state = { step:1, sport:null, people:null, dateOffset:0, duration:60, slotHour:null, name:"", whatsapp:"", bookingCode:null, assignedTable:null };
      render();
    });
    wrap.appendChild(again);
    return wrap;
  }

  render();
})();
</script>
